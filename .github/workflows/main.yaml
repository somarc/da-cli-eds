name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm run lint
    - name: Install published da-cli
      run: npm install --global @somarc/da-cli@latest
    - name: Validate static da-cli flows
      run: npm run validate:flows
