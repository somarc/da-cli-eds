name: da-cli-eds-final-cut-promotion
# Promotion is a separate human-approved operation over the reviewed canonical
# manifest. Run dogfood/certify.yaml and inspect its evidence first. Root
# --commit is the executable mutation boundary; requires_approval adds an
# explicit pipeline gate but does not attest reviewer identity or provenance.
#
# Plan:
#   da --org somarc --repo da-cli-eds --branch main pipeline run dogfood/promote.yaml --dry-run --format json
# Execute only after explicit human approval:
#   da --org somarc --repo da-cli-eds --branch main --commit pipeline run dogfood/promote.yaml --approve publish-canonical --format json
steps:
  - id: preview-readiness
    command: site freshness / --include-shared --fail-on preview-stale,preview-missing,source-missing,probe-failed,unknown --format json
  - id: contract-codebus
    command: audit contracts --prefix / --verify-code --format json
    depends_on: [preview-readiness]
  - id: publish-canonical
    command: publish pages dogfood/canonical-pages.txt --bulk --format json
    depends_on: [contract-codebus]
    requires_approval: true
  - id: rebuild-live-sitemap
    command: sitemap rebuild /sitemap.xml --format json
    depends_on: [publish-canonical]
  - id: purge-live-sitemap-cache
    # Rebuild refreshes the generated artifact. Invalidate its live CDN cache
    # so the live host serves that regenerated output before verification.
    command: code purge /sitemap.xml --yes --format json
    depends_on: [rebuild-live-sitemap]
  - id: verify-live-sitemap
    command: sitemap verify /sitemap.xml --target live --allow-content-paths --require-path /agentic-workflow --format json
    depends_on: [purge-live-sitemap-cache]
  - id: live-freshness
    command: site freshness / --include-shared --fail-on preview-stale,live-stale,preview-missing,source-missing,probe-failed,unknown --format json
    depends_on: [verify-live-sitemap]
  - id: final-doctor
    command: site doctor --agent --deep --format json
    depends_on: [live-freshness]
